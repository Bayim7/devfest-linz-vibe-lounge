<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linz Local Guide | Vibe Lounge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 sm:p-8">

    <div class="max-w-2xl mx-auto space-y-6">
        <header class="space-y-2">
            <a href="index.html" class="text-xs text-blue-400 hover:underline">&larr; Back to Vibe Lounge</a>
            <h1 class="text-3xl font-extrabold text-white">Linz Local Guide</h1>
            <p class="text-sm text-slate-400">Combine Gemini with Google Maps links. Edit the code to give it your own weird angle!</p>
        </header>

        <!-- API Key Input -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Gemini API Key</label>
            <input id="apiKey" type="password" placeholder="Paste your Google AI Studio API key here..." 
                   class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <!-- Prompt Input -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">What kind of Linz guide do you want?</label>
            <textarea id="userPrompt" rows="2" 
                      class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">Find 3 quirky spots in Linz to recover after a failed production deploy, including one great place for Leberkäse.</textarea>
            <button id="generateBtn" onclick="generateGuide()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-lg transition">
                Generate Linz Guide
            </button>
        </div>

        <!-- Output Area -->
        <div id="status" class="text-sm text-slate-400 hidden"></div>
        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        async function generateGuide() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const userPrompt = document.getElementById('userPrompt').value.trim();
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            const btn = document.getElementById('generateBtn');

            if (!apiKey) {
                alert("Please paste your Gemini API key first!");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Exploring Linz...";
            status.classList.remove('hidden');
            status.textContent = "Asking Gemini for recommendations...";
            results.innerHTML = "";

            // --- CUSTOMIZE THE PERSONALITY HERE ---
            const systemPrompt = `You are a witty, local Linz tour guide. 
            Respond ONLY with a valid JSON array of objects. Each object must have:
            - "name": Name of the real place in Linz, Austria
            - "vibe": A funny 1-2 sentence explanation of why it fits the request
            - "mapsQuery": Exact search string for Google Maps (e.g., "Leberkas-Pepi Linz Austria")`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        contents: [{ parts: [{ text: userPrompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const places = JSON.parse(data.candidates[0].content.parts[0].text);
                status.classList.add('hidden');

                places.forEach(place => {
                    const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.mapsQuery)}`;
                    results.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-2">
                            <h3 class="text-lg font-bold text-white">${place.name}</h3>
                            <p class="text-sm text-slate-300">${place.vibe}</p>
                            <a href="${mapsUrl}" target="_blank" class="inline-block text-sm font-semibold text-emerald-400 hover:text-emerald-300 pt-1">
                                Open in Google Maps &rarr;
                            </a>
                        </div>
                    `;
                });
            } catch (err) {
                status.textContent = "Error: " + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Generate Linz Guide";
            }
        }
    </script>
</body>
</html>
