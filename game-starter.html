<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mini-Game | Vibe Lounge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 sm:p-8 flex flex-col">

    <div class="max-w-2xl w-full mx-auto flex-1 flex flex-col space-y-4">
        <header class="flex items-center justify-between">
            <div>
                <a href="index.html" class="text-xs text-blue-400 hover:underline">&larr; Back to Vibe Lounge</a>
                <h1 class="text-2xl font-extrabold text-white">Survive DevFest Linz</h1>
            </div>
            <button onclick="startGame()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700">
                Restart Game
            </button>
        </header>

        <!-- API Key Input -->
        <input id="apiKey" type="password" placeholder="Paste your Gemini API key here to start..." 
               class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">

        <!-- Game Log -->
        <div id="chatLog" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 overflow-y-auto min-h-[300px] max-h-[55vh]">
            <p class="text-sm text-slate-400 italic">Paste your API key above and click "Start / Send" to begin.</p>
        </div>

        <!-- Player Input -->
        <div class="flex gap-2">
            <input id="playerInput" type="text" placeholder="Type your action or choice..." 
                   onkeydown="if(event.key==='Enter') sendMove()"
                   class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
            <button id="sendBtn" onclick="sendMove()" 
                    class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-2.5 rounded-lg transition">
                Send
            </button>
        </div>
    </div>

    <script>
        // --- CUSTOMIZE YOUR GAME RULES HERE ---
        const GAME_RULES = `You are the chaotic, funny Game Master of a 3-turn survival game called "Survive DevFest Linz with 5% Phone Battery".
        Keep every response under 3 sentences.
        Always end with 2 absurd choices (A or B) for the player.
        On Turn 3, declare whether the player WON or LOST based on their choices.`;

        let history = [];

        function appendMessage(sender, text) {
            const chatLog = document.getElementById('chatLog');
            const isAI = sender === 'Game Master';
            chatLog.innerHTML += `
                <div class="${isAI ? 'bg-slate-800/80 border-slate-700' : 'bg-purple-900/30 border-purple-800/50 ml-8'} border rounded-lg p-3 text-sm">
                    <div class="text-xs font-bold uppercase tracking-wider mb-1 ${isAI ? 'text-purple-400' : 'text-slate-400'}">${sender}</div>
                    <div class="whitespace-pre-wrap text-slate-200">${text}</div>
                </div>
            `;
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function startGame() {
            history = [];
            document.getElementById('chatLog').innerHTML = '';
            document.getElementById('playerInput').value = 'Start the game!';
            sendMove();
        }

        async function sendMove() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const inputEl = document.getElementById('playerInput');
            const btn = document.getElementById('sendBtn');
            const userText = inputEl.value.trim() || "Start the game!";

            if (!apiKey) {
                alert("Please paste your Gemini API key first!");
                return;
            }

            if (history.length === 0) document.getElementById('chatLog').innerHTML = '';
            
            appendMessage('You', userText);
            history.push({ role: "user", parts: [{ text: userText }] });
            inputEl.value = "";
            btn.disabled = true;
            btn.textContent = "...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: GAME_RULES }] },
                        contents: history
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiReply = data.candidates[0].content.parts[0].text;
                history.push({ role: "model", parts: [{ text: aiReply }] });
                appendMessage('Game Master', aiReply);
            } catch (err) {
                appendMessage('System', 'Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Send";
            }
        }
    </script>
</body>
</html>
